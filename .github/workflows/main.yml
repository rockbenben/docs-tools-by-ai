name: 🚀 Deploy website on push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7
        with:
          # 获取所有标记和分支的所有历史记录（updatetime 必须，否则每次都会变化）
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          # submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install
      # 补 rspress checkDeadLinks 的盲区：frontmatter 里的链接与图片路径
      # （正文链接由 rspress 自己校验，坏链会直接让下一步 build 失败）
      - name: Check links
        run: yarn check:links
      - name: Build website
        run: yarn build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 这是文档部署到的分支名称
          branch: gh-pages
          folder: doc_build
